[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftguard"
version = "0.3.0"
description = "AI observability and drift monitoring SDK for LLM-powered applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DriftGuard Team" }]
keywords = ["ai", "observability", "drift", "llm", "monitoring", "mlops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.6",
  "numpy>=2.0",
  "pandas>=2.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pyjwt>=2.8.0",
  "psycopg2-binary>=2.9.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-anyio",
  "httpx>=0.27.0",
  "bandit>=1.7.0",
  "safety>=2.3.0",
]

[project.urls]
Homepage = "https://driftguard.dev"
Repository = "https://github.com/your-org/driftguard"
Documentation = "https://docs.driftguard.dev"
"Bug Tracker" = "https://github.com/your-org/driftguard/issues"

[project.scripts]
driftguard-server = "driftguard.routes:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["driftguard*"]
